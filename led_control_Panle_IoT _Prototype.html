<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 LED Control</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #12181f;
    --wire-copper: #c98a4b;
    --wire-copper-bright: #e6a86a;
    --led-off: #3a2a1a;
    --led-on: #ffb347;
    --led-glow: #ffc670;
    --text: #e8e2d8;
    --text-dim: #8a8f98;
    --ok: #7fbf7f;
    --bad: #d97a6c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, #17202a 0%, var(--bg) 60%);
    font-family: 'Courier New', ui-monospace, Consolas, monospace;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .board{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid #232b35;
    border-radius:6px;
    padding:28px 24px 32px;
    position:relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .board::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px dashed #26303c;
    border-radius:4px;
    pointer-events:none;
  }

  .label{
    font-size:11px;
    letter-spacing:1px;
    color:var(--text-dim);
    margin:0 0 4px;
  }
  h1{
    font-size:19px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--text);
    line-height:1.35;
  }
  .subhead{
    font-size:12px;
    color:var(--text-dim);
    margin:0 0 22px;
  }

  .rail{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:14px;
    margin: 8px 0 26px;
    padding-bottom:14px;
    border-bottom:1px dashed #26303c;
  }

  .channel{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
  }

  .bulb-wrap{
    position:relative;
    width:100%;
    height:80px;
    display:flex;
    justify-content:center;
  }
  .bulb{
    width:44px;
    height:44px;
    margin-top:6px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--led-off), #201510 75%);
    border:3px solid #4a3822;
    transition: background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    position:relative;
    z-index:2;
  }
  .bulb.on{
    background: radial-gradient(circle at 35% 30%, #fff3d6, var(--led-on) 55%, #c97f1f 100%);
    border-color: var(--led-glow);
    box-shadow:
      0 0 14px 5px rgba(255,179,71,0.55),
      0 0 34px 14px rgba(255,179,71,0.22);
  }
  .lead{
    position:absolute;
    bottom:0;
    width:2px;
    height:32px;
    background:var(--wire-copper);
    left:50%;
    transform:translateX(-50%);
    z-index:1;
  }

  .chan-label{
    font-size:12px;
    color:var(--text);
    margin-top:8px;
  }
  .chan-sub{
    font-size:10px;
    color:var(--text-dim);
    margin-top:1px;
  }

  .toggle{
    appearance:none;
    -webkit-appearance:none;
    width:46px;
    height:26px;
    background:#241b12;
    border:1px solid #3a2a1a;
    border-radius:999px;
    position:relative;
    cursor:pointer;
    outline:none;
    flex-shrink:0;
    margin-top:12px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .toggle::before{
    content:"";
    position:absolute;
    top:2px; left:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:#6b5a42;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .toggle:checked{
    background:#4a3110;
    border-color: var(--led-glow);
  }
  .toggle:checked::before{
    transform: translateX(20px);
    background: var(--led-on);
    box-shadow: 0 0 8px 2px rgba(255,179,71,0.7);
  }
  .toggle:disabled{
    opacity:0.5;
    cursor:wait;
  }

  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--text-dim);
    transition: background 0.2s ease;
  }
  .dot.ok{background:var(--ok);}
  .dot.bad{background:var(--bad);}

  .all-row{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .all-btn{
    flex:1;
    background:#1a2028;
    border:1px solid #2a323d;
    color:var(--text);
    font-family:inherit;
    font-size:12px;
    padding:9px 0;
    border-radius:4px;
    cursor:pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .all-btn:hover{
    border-color: var(--wire-copper);
    background:#1f2730;
  }
  .all-btn:disabled{
    opacity:0.5;
    cursor:wait;
  }

  .footnote{
    margin-top:22px;
    font-size:11px;
    color:var(--text-dim);
    text-align:center;
    line-height:1.6;
  }
  .footnote code{
    background:#1c232c;
    padding:1px 5px;
    border-radius:3px;
    color:var(--wire-copper-bright);
  }

  .config-warning{
    margin-top:16px;
    font-size:12px;
    color:var(--bad);
    background:rgba(217,122,108,0.08);
    border:1px solid rgba(217,122,108,0.35);
    border-radius:4px;
    padding:10px 12px;
    line-height:1.5;
    display:none;
  }
</style>
</head>
<body>

<div class="board">
  <p class="label">ESP32 · BLYNK IOT PROTOTYPE</p>
  <h1>LED Control Panel</h1>
  <p class="subhead" id="globalStatus">checking connection…</p>

  <div class="rail" id="rail">
    <!-- channels injected by script -->
  </div>

  <div class="all-row">
    <button class="all-btn" id="allOn">All on</button>
    <button class="all-btn" id="allOff">All off</button>
  </div>

  <div class="config-warning" id="configWarning">
    Set <code>AUTH_TOKEN</code> in the script before hosting this page.
  </div>

  <p class="footnote">Each switch sends a live command<br>to the physical ESP32 over Wi-Fi.</p>
</div>

<script>
  // ---- CONFIGURE THIS ----
  const AUTH_TOKEN = "IeskRJuOhm0nEwHP3gl29Fku_SW_wNbq"; // paste your Blynk device auth token here
  const CHANNELS = [
    { pin: "V0", name: "LED 1" },
    { pin: "V1", name: "LED 2" },
    { pin: "V2", name: "LED 3" },
  ];
  // -------------------------

  const BASE = "https://blynk.cloud/external/api";
  const rail = document.getElementById('rail');
  const globalStatus = document.getElementById('globalStatus');
  const configWarning = document.getElementById('configWarning');
  const allOnBtn = document.getElementById('allOn');
  const allOffBtn = document.getElementById('allOff');

  const configured = AUTH_TOKEN && AUTH_TOKEN !== "YOUR_BLYNK_AUTH_TOKEN";

  // build channel UI
  CHANNELS.forEach((ch, i) => {
    const el = document.createElement('div');
    el.className = 'channel';
    el.innerHTML = `
      <div class="status-row">
        <div class="dot" data-dot></div>
      </div>
      <div class="bulb-wrap">
        <div class="lead"></div>
        <div class="bulb" data-bulb></div>
      </div>
      <div class="chan-label">${ch.name}</div>
      <div class="chan-sub">${ch.pin}</div>
      <input type="checkbox" class="toggle" data-toggle disabled>
    `;
    rail.appendChild(el);
    ch.el = el;
    ch.bulb = el.querySelector('[data-bulb]');
    ch.toggle = el.querySelector('[data-toggle]');
    ch.dot = el.querySelector('[data-dot]');

    ch.toggle.addEventListener('change', () => sendState(ch, ch.toggle.checked));
  });

  if (!configured) {
    configWarning.style.display = "block";
    globalStatus.textContent = "not configured";
  } else {
    init();
  }

  async function init() {
    await refreshAll();
    CHANNELS.forEach(ch => ch.toggle.disabled = false);
    allOnBtn.disabled = false;
    allOffBtn.disabled = false;
  }

  async function refreshAll() {
    const results = await Promise.all(CHANNELS.map(ch => refreshState(ch)));
    const anyOnline = results.some(r => r);
    globalStatus.textContent = anyOnline ? "connected to device" : "offline / unreachable";
  }

  async function refreshState(ch) {
    try {
      const res = await fetch(`${BASE}/get?token=${AUTH_TOKEN}&${ch.pin}`);
      if (!res.ok) throw new Error("bad response");
      const val = (await res.text()).replace(/"/g, '').trim();
      setChannelUI(ch, val === "1", true);
      return true;
    } catch (err) {
      setChannelUI(ch, ch.toggle.checked, false);
      return false;
    }
  }

  async function sendState(ch, isOn) {
    ch.toggle.disabled = true;
    try {
      const res = await fetch(`${BASE}/update?token=${AUTH_TOKEN}&${ch.pin}=${isOn ? 1 : 0}`);
      if (!res.ok) throw new Error("bad response");
      setChannelUI(ch, isOn, true);
    } catch (err) {
      setChannelUI(ch, !isOn, false);
      ch.toggle.checked = !isOn; // revert
    } finally {
      ch.toggle.disabled = false;
    }
  }

  function setChannelUI(ch, isOn, connected) {
    ch.toggle.checked = isOn;
    ch.bulb.classList.toggle('on', isOn);
    ch.dot.classList.toggle('ok', connected);
    ch.dot.classList.toggle('bad', !connected);
  }

  async function setAll(isOn) {
    allOnBtn.disabled = true;
    allOffBtn.disabled = true;
    await Promise.all(CHANNELS.map(ch => sendState(ch, isOn)));
    allOnBtn.disabled = false;
    allOffBtn.disabled = false;
  }

  allOnBtn.addEventListener('click', () => setAll(true));
  allOffBtn.addEventListener('click', () => setAll(false));

  // keep in sync if someone toggles from the Blynk app too
  setInterval(() => {
    if (configured && !CHANNELS.some(ch => ch.toggle.disabled)) {
      refreshAll();
    }
  }, 4000);
</script>

</body>
</html>
